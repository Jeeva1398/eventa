name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check tag matches package version
        run: test "v$(node -p "require('./packages/cli/package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm test -w eventa
      - run: npm run build -w eventa
      - run: npm publish -w eventa --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  binaries:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build -w eventa
      - name: Compile standalone binaries
        run: |
          mkdir -p release
          for target in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64 bun-windows-x64; do
            ext=""; [ "$target" = "bun-windows-x64" ] && ext=".exe"
            bun build packages/cli/dist/index.js --compile --target="$target" --outfile "release/eventa-${target#bun-}$ext"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
